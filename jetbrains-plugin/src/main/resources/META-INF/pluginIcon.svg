<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40" role="img" aria-label="MarkText Markdown Editor">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3D5AFE"/>
      <stop offset="55%" stop-color="#5B41D9"/>
      <stop offset="100%" stop-color="#7B3FE4"/>
    </linearGradient>
  </defs>

  <!-- rounded square body -->
  <rect x="0" y="0" width="40" height="40" rx="9" ry="9" fill="url(#bg)"/>

  <!-- stylised M: two stems with a deep V valley, the valley tip reads as a Markdown caret -->
  <path d="M 10.5 27 L 10.5 10.5 L 20 20.5 L 29.5 10.5 L 29.5 27"
        fill="none" stroke="#FFFFFF" stroke-width="3.1"
        stroke-linecap="square" stroke-linejoin="miter"/>

  <!-- underline: the Markdown text baseline -->
  <rect x="14.5" y="29.7" width="11" height="1.7" rx="0.85" fill="#FFFFFF" fill-opacity="0.7"/>
</svg>
